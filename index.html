    html += '<div class="task"><div class="m">40 分</div><div class="x"><b>通串整会</b>　今天不背新组。把第 '+D.a+'–'+D.b+' 组从头串一遍，合书，卡住做记号，串完只练记号那几处。</div><button class="tbtn" data-task="通串整会" data-min="40">开始 40 分</button></div>';
  } else {
    html += '<div class="task"><div class="m">25 分</div><div class="x"><b>背新的</b>　出声慢读五遍，合书忆一遍；再读两遍，再忆一遍。三轮到不打磕。</div><button class="tbtn" data-task="背新的" data-min="25">开始 25 分</button></div>';
  }
  if(D.kind!=='review'){
    html += '<div class="task"><div class="m">5 分</div><div class="x"><b>串一遍</b>　从第 '+D.cfrom+' 组串到第 '+D.b+' 组，合书，卡住做记号，继续往下。已串 '+chuan.t+'/'+chuan.c+'</div><button class="tbtn" data-task="串一遍" data-min="5">开始 5 分</button></div>';
  }
  html += '</div>';

  html += '<div class="h2">'+(D.kind==='review'?'今日串背范围':'今日内容')+'<span class="cnt">'+prog.t+' / '+prog.c+' 组</span></div>';
  html += '<div class="toolbar"><button class="btn" id="tog">遮住汉意</button><button class="btn" id="allck">全部标记已背</button></div>';
  html += '<div id="today-list">' + listHtml(D.a, D.b) + '</div>';
  html += '<div class="note" style="margin-top:14px">背的时候只看咒文；卡住了点一下那一组，汉意会出来，看一眼就收回去。背完一组，点右边的圈。</div>';
  el.innerHTML = html;

  var tog = document.getElementById('tog');
  tog.onclick = function(){ var L=document.getElementById('today-list'); var on=L.className.indexOf('hidehan')<0; L.className = on?'hidehan':''; tog.className='btn'+(on?' on':''); tog.textContent = on?'显示汉意':'遮住汉意'; };
  document.getElementById('allck').onclick = function(){ for(var i=D.a;i<=D.b;i++) S.done[i]=1; save(); render(); };
}

function renderReview(){
  var el = document.getElementById('v-review'), d = curDay();
  if(!d || d<1){ el.innerHTML = '<div class="empty">先在「今日」里设定开始日。</div>'; return; }
  var html = '<div class="h2">昨天与前天</div>';
  var added = 0;
  for(var k=2;k<=3;k++){
    var dd = d - (k-1);
    if(dd<1) continue;
    var D = DATA.days[dd-1];
    html += '<div class="card"><div class="t">第 '+dd+' 天 · 第 '+D.a+'–'+D.b+' 组</div><div class="s">'+esc(D.t)+'</div></div>';
    html += '<div class="rev" data-seg="'+dd+'">' + listHtml(D.a, D.b) + '</div>';
    added++;
  }
  if(!added) html += '<div class="empty">还没有可复习的内容。</div>';
  html += '<div class="h2">往前三天</div>';
  for(var j=4;j<=6;j++){
    var dn = d-(j-1); if(dn<1) continue;
    var E = DATA.days[dn-1];
    html += '<div class="pitem"><div class="pd">D'+dn+'</div><div class="pg">'+E.a+'–'+E.b+'</div><div class="pt">'+esc(E.t)+'</div></div>';
  }
  el.innerHTML = html;
}

function renderPlan(){
  var el = document.getElementById('v-plan'), d = curDay();
  var html = '<div class="h2">三十天日程<span class="cnt">点一天可查看</span></div><div class="plan">';
  for(var i=0;i<DATA.days.length;i++){
    var D = DATA.days[i];
    var cls = 'pitem' + (d===D.d?' cur':'') + (d>D.d?' fin':'');
    var st = d>D.d ? '✓' : (d===D.d ? '今' : D.kind==='review'?'串':'');
    html += '<div class="'+cls+'" data-day="'+D.d+'"><div class="pd">D'+D.d+'</div><div class="pg">'+D.a+'–'+D.b+'</div><div class="pt">'+esc(D.t)+'</div><div class="ps">'+st+'</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.onclick = function(e){ var t=e.target.closest('[data-day]'); if(!t) return; var dn=parseInt(t.getAttribute('data-day'),10); S.tab='today'; save(); location.hash=''; showTab('today'); var D=DATA.days[dn-1]; alert('第 '+dn+' 天：第 '+D.a+'–'+D.b+' 组\n'+D.t); };
}

function audInputs(){
  var nm = {1:'第一会',2:'第二会',3:'第三会',4:'第四会',5:'第五会'};
  var out='';
  for(var k in nm){ out += '<div class="lbl">'+nm[k]+'</div><input class="inp" data-au="'+k+'" value="'+esc(S.aud[k]||'')+'" placeholder="https://...mp3">'; }
  out += '<div class="lbl">全咒（备用）</div><input class="inp" data-au="all" value="'+esc(S.aud.all||'')+'" placeholder="https://...mp3">';
  return out;
}
function renderSetup(){
  var el = document.getElementById('v-setup');
  var total = 0; for(var k in S.done){ if(S.done[k]) total++; }
  el.innerHTML = '<div class="h2">开始日</div><div class="card"><input type="date" id="sd" value="'+(S.start||todayStr())+'"><div class="note" style="margin-top:8px">改了开始日，天数会按新日期重算，已打的勾不变。</div></div>'
    + '<div class="h2">进度</div><div class="card"><div class="s">已打勾 '+total+' / 258 组</div></div>'
    + '<div class="h2">诵咒音频</div><div class="card">'
    + '<div class="note">填入音频直链（mp3，https 开头）。填了哪一会，当天走到那一会时首页就会出现播放器；全咒音频填在最后一项，没单填的会都用它。留空则不显示。</div>'
    + audInputs()
    + '</div>'
    + '<button class="btn" id="reset" style="width:100%;padding:12px">清空全部进度</button>'
    + '<div class="h2">怎么用</div><div class="note">'
    + '一、每天四十分钟：忆旧的十分、背新的二十五分、串一遍五分。<br>'
    + '二、背的时候点「遮住汉意」，只看咒文；卡住了点开那一组看一眼，再收回。<br>'
    + '三、背完点右边的圈打勾，进度自动存在这台手机上。<br>'
    + '四、标「串」的三天（D9、D17、D23）不背新组，只把整会串一遍；D30 全咒通背。<br>'
    + '五、各组依成观法师《楞严咒大意》整理，音译用字照录底本，共修以课诵本为准。'
    + '</div>';
  var sd = document.getElementById('sd');
  sd.onchange = function(){ S.start = sd.value; save(); render(); };
  document.getElementById('reset').onclick = function(){ if(confirm('清空已打勾的记录？')){ S.done={}; save(); render(); } };
  el.onchange = function(e){ var t=e.target; if(t && t.getAttribute && t.getAttribute('data-au')){ S.aud[t.getAttribute('data-au')] = (t.value||'').trim(); save(); } };
}

function showTab(t){
  S.tab = t; save();
  var ids=['today','review','plan','setup'];
  for(var i=0;i<ids.length;i++){ document.getElementById('v-'+ids[i]).style.display = (ids[i]===t?'block':'none'); }
  var as = document.querySelectorAll('nav a');
  for(var j=0;j<as.length;j++){ as[j].className = as[j].getAttribute('data-tab')===t?'on':''; }
  if(t==='today') renderToday();
  if(t==='review') renderReview();
  if(t==='plan') renderPlan();
  if(t==='setup') renderSetup();
}

document.addEventListener('click', function(e){
  var tb = e.target.closest('[data-task]');
  if(tb){ startT(tb.getAttribute('data-task'), parseInt(tb.getAttribute('data-min'),10)); return; }
  var ck = e.target.closest('[data-ck]');
  if(ck){ var n = parseInt(ck.getAttribute('data-ck'),10); if(S.done[n]) delete S.done[n]; else S.done[n]=1; save(); render(); return; }
  var row = e.target.closest('.row');
  if(row){ row.className = row.className.indexOf('shown')>=0 ? row.className.replace(' shown','') : row.className+' shown'; }
}, false);

var navs = document.querySelectorAll('nav a');
for(var i=0;i<navs.length;i++){ navs[i].addEventListener('click', function(){ showTab(this.getAttribute('data-tab')); }); }

function render(){ head(); showTab(S.tab||'today'); }
document.getElementById('tpause').onclick = function(){ if(!T.n) return; if(T.run){ T.remain=T.end-Date.now(); T.run=false; } else { T.end=Date.now()+T.remain; T.run=true; } save(); drawT(); };
document.getElementById('tstop').onclick = stopT;
setInterval(tick,500);
drawT();
render();
</script>
</body>
</html>
